spring.application.name=money-ai

# MySQL (ajuste usuário/senha)
spring.datasource.url=jdbc:mysql://localhost:3306/money_ai?createDatabaseIfNotExist=true&serverTimezone=America/Fortaleza&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pasta com os dados de idioma do Tesseract (OCR de PNG), ex.: por.traineddata
moneyai.ocr.datapath=${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
moneyai.ocr.language=por

# Origens do frontend autorizadas a chamar a API (separadas por vírgula)
moneyai.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:*,http://127.0.0.1:*}
