<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money-AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="icon-btn" id="newChat" aria-label="Nova conversa">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>Money-AI</h1>
      <button class="icon-btn" id="openSheet" aria-label="Abrir lançamentos">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </header>

    <main class="stage" id="stage">
      <section class="welcome" id="welcome">
        <div class="orb" aria-hidden="true"></div>
        <h2>Oi, eu sou o Money-AI!</h2>
        <p>Como posso ajudar?</p>
        <div class="chips" id="chips"></div>
      </section>
      <section class="messages" id="messages" aria-live="polite"></section>
    </main>

    <div class="followups" id="followups" hidden>
      <button class="cta" id="ctaMain"></button>
      <button class="skip" id="ctaSkip">Pular</button>
    </div>

    <form class="composer" id="chatForm">
      <label class="plus" title="Anexar PDF, DOCX ou PNG">
        <input type="file" id="file" accept=".pdf,.docx,.png" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </label>
      <input id="text" type="text" placeholder="Mensagem para o Money-AI…" autocomplete="off" aria-label="Mensagem">
      <button class="send" id="sendBtn" type="submit" aria-label="Enviar"></button>
    </form>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="sheet" id="sheet" aria-label="Lançamentos" aria-hidden="true">
      <div class="sheet-head">
        <div class="balance"><span>Saldo</span><strong id="balance">R$ 0,00</strong></div>
        <button class="icon-btn" id="closeSheet" aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <form class="tx-form" id="txForm">
        <input type="hidden" id="txId">
        <input id="txDesc" placeholder="Descrição" maxlength="120" required>
        <div class="row">
          <input id="txAmount" type="number" step="0.01" min="0.01" placeholder="Valor" required>
          <select id="txType"><option value="EXPENSE">Despesa</option><option value="INCOME">Receita</option></select>
        </div>
        <div class="row">
          <input id="txCategory" placeholder="Categoria" maxlength="60">
          <input id="txDate" type="date">
        </div>
        <div class="row">
          <button class="cta" type="submit" id="txSave">Adicionar</button>
          <button class="skip" type="button" id="txCancel" hidden>Cancelar</button>
        </div>
      </form>
      <ul class="list" id="list"></ul>
    </aside>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
